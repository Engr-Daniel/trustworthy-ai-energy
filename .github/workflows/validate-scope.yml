name: Validate saved scoping records
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r review-paper/scripts/requirements-test.txt
      - run: python review-paper/scripts/validate_scope.py
      - run: python review-paper/scripts/validate_manuscript.py
      - run: python -m unittest discover -s review-paper/scripts/tests -v
